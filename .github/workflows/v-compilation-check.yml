name: V Compilation Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  v-compilation-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Setup V
      uses: vlang/setup-v@v1.4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run V Compilation Check
      run: |
        python scripts/check_v_compilation.py
      continue-on-error: true

    - name: Upload Report
      uses: actions/upload-artifact@v4
      with:
        name: v-compilation-report
        path: docs/test-compilation-status.md
